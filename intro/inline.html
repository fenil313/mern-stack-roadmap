<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        console.log("Hello World");
    </script>
</head>
<body>
    <button onclick="alert('Hello from Inline JS!')">Click Me</button>

</body>
</html>
